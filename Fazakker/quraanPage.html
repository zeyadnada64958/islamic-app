<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa+Ink:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=BBH+Hegarty&family=Blaka+Ink&family=Caveat:wght@400..700&family=Edu+AU+VIC+WA+NT+Guides:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manufacturing+Consent&family=Oi&family=Permanent+Marker&family=Playpen+Sans+Arabic:wght@100..800&family=Special+Elite&family=Tajawal:wght@200;300;400;500;700;800;900&family=Titan+One&family=Yellowtail&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa+Ink:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=BBH+Hegarty&family=Blaka+Ink&family=Caveat:wght@400..700&family=Edu+AU+VIC+WA+NT+Guides:wght@400..700&family=Estedad:wght@100..900&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manufacturing+Consent&family=Oi&family=Permanent+Marker&family=Playpen+Sans+Arabic:wght@100..800&family=Special+Elite&family=Tajawal:wght@200;300;400;500;700;800;900&family=Titan+One&family=Yellowtail&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>

/* =========================================
   ROOT
========================================= */

:root{
    --gold:#d4af37;
    --gold-light:#f6df95;
    --dark:#120c07;
    --cream:#fffaf0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Tajawal',sans-serif;

    overflow-x:hidden;

    background:
    linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.88)),
    url("https://images.unsplash.com/photo-1519817650390-64a93db51149?q=80&w=1974&auto=format&fit=crop");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;

}

/* =========================================
   HEADER
========================================= */

.header{

    position:fixed;
    top:0;

    width:100%;

    z-index:9999;

    backdrop-filter:blur(20px);

    background:
    rgba(0,0,0,.35);

    border-bottom:
    1px solid rgba(255,255,255,.08);

}

.header-content{

    max-width:1600px;

    margin:auto;

    padding:22px 35px;

    display:flex;
    justify-content:space-between;
    align-items:center;

}

.logo{

    display:flex;
    align-items:center;
    gap:16px;

    color:var(--gold-light);

    font-size:2rem;
    font-weight:900;

}

.logo i{
    font-size:2rem;
}

/* =========================================
   SEARCH
========================================= */

.search-box{
    position:relative;
}

.search-box input{

    width:340px;
    height:62px;

    border:none;
    outline:none;

    border-radius:60px;

    padding:0 65px 0 25px;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    color:white;

    font-size:1rem;
}

.search-box input::placeholder{
    color:rgba(255,255,255,.6);
}

.search-box i{

    position:absolute;

    right:24px;
    top:50%;

    transform:translateY(-50%);

    color:var(--gold-light);

}

/* =========================================
   MAIN
========================================= */

.main{

    max-width:1600px;

    margin:auto;

    padding:150px 35px 60px;

}

/* =========================================
   HERO
========================================= */

.hero{

    position:relative;

    overflow:hidden;

    border-radius:40px;

    padding:80px 50px;

    text-align:center;

    margin-bottom:60px;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:
    1px solid rgba(255,255,255,.08);

}



.hero-content{
    position:relative;
    z-index:2;
}

.basmala{

    font-family:'Amiri Quran',serif;
    font-size:3rem;
    color:var(--gold-light);
    margin-bottom:18px;
}

.hero-title{
    font-size:4.5rem;
    font-weight:900;
    margin-bottom:16px;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

}

.hero-sub{

    opacity:.9;

    font-size:1.2rem;

}

/* =========================================
   GRID
========================================= */

.surahs-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(290px,1fr));

    gap:30px;

}

/* =========================================
   SURAH CARD
========================================= */

.surah-card{

    position:relative;

    overflow:hidden;

    border-radius:35px;

    padding:35px 25px;

    cursor:pointer;

    transition:.45s;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(14px);

    border:
    1px solid rgba(255,255,255,.08);

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

}

.surah-card::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
    135deg,
    rgba(212,175,55,.18),
    transparent 50%
    );

    opacity:0;

    transition:.4s;

}

.surah-card:hover{

    transform:
    translateY(-15px)
    scale(1.03);

    border-color:
    rgba(212,175,55,.35);

    box-shadow:
    0 30px 80px rgba(0,0,0,.35);

}

.surah-card:hover::before{
    opacity:1;
}

/* =========================================
   TOP
========================================= */

.surah-top{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:28px;

}

/* =========================================
   NUMBER
========================================= */

.surah-number{

    width:74px;
    height:74px;
    font-family: Inter,sans-serif;
    border-radius:22px;

    background:
    linear-gradient(
    135deg,
    #f6df95,
    #c69227
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#2d1808;

    font-size:1.5rem;
    font-weight:900;

    box-shadow:
    0 12px 30px rgba(0,0,0,.22);

}

/* =========================================
   ICON
========================================= */

.surah-icon{

    width:62px;
    height:62px;

    border-radius:18px;

    background:
    rgba(255,255,255,.08);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#f6df95;

    font-size:1.4rem;

}

/* =========================================
   NAME
========================================= */

.surah-name{
    font-family: 'Aref Ruqaa', serif;
    font-size: 3rem;
    font-weight: 700;
    text-align: center;
    color: #f6df95;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
}

.surah-name::after{

    content:"";

    position:absolute;

    bottom:115px;
    left:50%;

    transform:translateX(-50%);

    width:70px;
    height:3px;

    border-radius:20px;

    background:
    linear-gradient(
    90deg,
    transparent,
    #f6df95,
    transparent
    );

}

/* =========================================
   INFO
========================================= */

.surah-info{

    text-align:center;

    opacity:.88;

    line-height:2;

    font-size:1rem;

    color:#f3e7cf;

}

/* =========================================
   BUTTON
========================================= */

.surah-btn{

    margin-top:24px;
    font-family: Estedad;
    width:100%;
    height:58px;

    border:none;
    outline:none;

    border-radius:20px;

    cursor:pointer;

    font-size:1rem;
    font-weight:800;

    background:
    linear-gradient(
    135deg,
    #f6df95,
    #b8860b
    );

    color:#2d1808;

    transition:.35s;

}

.surah-btn:hover{

    transform:scale(1.03);

}

/* =========================================
   READER
========================================= */

.reader-page{

    position:fixed;
    inset:0;

    width:100%;
    height:100vh;

    overflow-y:auto;

    z-index:99999;

    display:none;

    padding:140px 40px 60px;

    background:
    linear-gradient(rgba(17,10,4,.94),rgba(17,10,4,.96)),
    url("https://www.transparenttextures.com/patterns/arabesque.png");

}

/* =========================================
   CLOSE
========================================= */

.close-reader{

    position:fixed;

    top:35px;
    left:35px;

    width:70px;
    height:70px;

    border:none;

    border-radius:50%;

    cursor:pointer;

    font-size:1.5rem;

    color:#2a1808;

    background:
    linear-gradient(135deg,#f6df95,#b8860b);

    z-index:999999;

    transition:.35s;

}

.close-reader:hover{

    transform:
    scale(1.1)
    rotate(90deg);

}

.surah-name{
    font-family: "Aref Ruqaa Ink", serif !important;
    font-size: 2.2rem;
    letter-spacing: 0.5px;
    font-weight: 700;
    text-align: center;
}

/* =========================================
   SURAH HERO
========================================= */

.surah-hero{

    text-align:center;

    margin-bottom:60px;

}

.surah-title-big{

    font-family:'Aref Ruqaa Ink',sans-serif;

    font-size:5.5rem;

    color:#f6df95;

    margin-bottom:20px;

    text-shadow:
    0 0 25px rgba(212,175,55,.25);

}

.meta{

    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;

}

.meta-box{

    padding:14px 28px;

    border-radius:50px;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    border:
    1px solid rgba(255,255,255,.08);

    font-weight:700;

}

/* =========================================
   MUSHAF
========================================= */

.mushaf{

    max-width:1200px;

    margin:auto;

    position:relative;

    overflow:hidden;

    border-radius:45px;

    padding:80px 70px;

    background:
    linear-gradient(rgba(255,251,244,.99),rgba(255,248,235,.99)),
    url("https://www.transparenttextures.com/patterns/arabesque.png");

    border:12px solid #b68a34;

    box-shadow:
    0 40px 120px rgba(0,0,0,.45);

}

.mushaf::before{

    content:"";

    position:absolute;

    inset:18px;

    border:
    2px solid rgba(182,138,52,.35);

    border-radius:35px;

}

/* =========================================
   BASMALA
========================================= */

.basmala-reader{

    position:relative;
    z-index:2;

    text-align:center;

    font-family:'Amiri Quran',serif;

    font-size:3rem;

    color:#7c4f1d;

    margin-bottom:55px;

}

/* =========================================
   AYAT
========================================= */

.ayahs{

    position:relative;
    z-index:2;

    font-family:'Amiri Quran',serif;

    font-size:2.6rem;

    line-height:2;

    color:#2d1b0d;

    text-align:justify;

}

.ayah{

    transition:.3s;

    border-radius:18px;

    padding:5px;

}

.ayah:hover{

    background:
    rgba(212,175,55,.12);

}

.ayah-number{
    font-family: Inter,sans-serif;
    display:inline-flex !important;
    align-items:center;
    justify-content:center;
    width:55px;
    height:55px;
    border-radius:50%;
    background:
    radial-gradient(circle at top,#ffe08a,#c69227);
    color:#2d1808;
    font-size:1.7rem;
    font-weight:900;
    margin:0 10px;
    vertical-align:middle;
}

/* =========================================
   LOADING
========================================= */

.loading{

    text-align:center;

    padding:100px 20px;

}

.loading-circle{

    width:90px;
    height:90px;

    border-radius:50%;

    border:6px solid rgba(0,0,0,.08);

    border-top:6px solid var(--gold);

    margin:auto;

    animation:spin 1s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.loading p{

    margin-top:25px;

    font-size:1.2rem;

    color:#6f4b20;

}

/* =========================================
   MOBILE
========================================= */

@media(max-width:900px){

.header-content{
    flex-direction:column;
    gap:20px;
}

.search-box input{
    width:100%;
}

.hero{
    padding:45px 25px;
}

.hero-title{
    font-size:2.6rem;
}

.surah-title-big{
    font-size:3rem;
}



.ayahs{
    font-size:1.9rem;
    line-height:2;
}

.basmala-reader{
    font-size:2.3rem;
}

}

/* =========================================
   SCROLLBAR
========================================= */

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-thumb{

    background:
    linear-gradient(var(--gold),#8d651b);

    border-radius:20px;

}

/* =========================================
   PREMIUM MOBILE UI
========================================= */

@media (max-width: 768px){

body{
    background-position:center;
    overflow-x:hidden;
}

/* HEADER */

.header{
    backdrop-filter:blur(18px);
    background:rgba(10,10,10,.55);
}

.header-content{
    flex-direction:column;
    gap:14px;
    padding:14px 14px;
}

.logo{
    font-size:1.3rem;
    gap:10px;
}

.logo i{
    font-size:1.2rem;
}

/* SEARCH */

.search-box{
    width:100%;
}

.search-box input{
    width:100%;
    height:50px;
    border-radius:18px;
    padding:0 50px 0 16px;
    font-size:.85rem !important;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
}

.search-box i{
    right:18px;
    font-size:.9rem;
}

/* MAIN */

.main{
    padding:115px 12px 25px;
}

/* HERO */

.hero{
    border-radius:24px;
    padding:28px 18px;
    margin-bottom:25px;
    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,.08),
    rgba(255,255,255,.03)
    );
}

.basmala{
    font-size:1.5rem;
    line-height:2.2rem;
}

.hero-title{
    font-size:1.7rem;
}

/* GRID */

.surahs-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

/* CARD */

.surah-card{
    padding:14px 10px;
    border-radius:22px;
    background:
    linear-gradient(
    180deg,
    rgba(255,255,255,.09),
    rgba(255,255,255,.04)
    );

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 10px 25px rgba(0,0,0,.25);
}

.surah-card:hover{
    transform:translateY(-6px) scale(1.02);
}

.surah-top{
    margin-bottom:14px;
}

.surah-number{
    width:42px;
    height:42px;
    border-radius:14px;
    font-size:.8rem;
}

.surah-icon{
    width:36px;
    height:36px;
    border-radius:12px;
    font-size:.8rem;
}

.surah-name{
    font-size:1.05rem !important;
    line-height:1.7;
    margin-bottom:10px;
}

.surah-name::after{
    bottom:72px;
    width:40px;
}

.surah-info{
    font-size:.68rem;
    line-height:1.7;
}

.surah-btn{
    height:38px;
    border-radius:14px;
    margin-top:14px;
}

.surah-btn svg{
    width:24px;
    height:24px;
}

/* READER PAGE */

.reader-page{
    padding:75px 10px 20px;
    background:
    linear-gradient(
    rgba(10,6,2,.97),
    rgba(10,6,2,.98)
    );
}

/* CLOSE BUTTON */

.close-reader{
    width:48px;
    height:48px;
    top:15px;
    left:15px;
    font-size:1rem;
}

/* SURAH HERO */

.surah-hero{
    margin-bottom:24px;
}

.surah-title-big{
    font-size:2rem;
    line-height:1.8;
    margin-bottom:12px;
}

.meta{
    gap:8px;
}

.meta-box{
    padding:8px 14px;
    border-radius:14px;
    font-size:.7rem;
}

/* MUSHAF */

.mushaf{
    width:100%;
    max-width:100%;
    padding:28px 18px;
    border-width:5px;
    border-radius:26px;

    background:
    linear-gradient(
    rgba(255,251,244,.995),
    rgba(255,248,235,.995)
    );

    box-shadow:
    0 20px 60px rgba(0,0,0,.35);
}

.mushaf::before{
    inset:10px;
    border-radius:18px;
}

/* BASMALA */

.basmala-reader{
    font-size:1.45rem;
    margin-bottom:25px;
    line-height:2.2;
}

/* AYAT */

.ayahs{
    font-size:1.28rem;
    line-height:2.8;
    text-align:right;
    color:#2d1b0d;
}

.ayah{
    display:inline;
}

.ayah-number{
    font-family: Inter,sans-serif;
    width:50px;
    height:50px;
    font-size:1.55rem;
    margin:0 4px;
}

/* LOADING */

.loading{
    padding:60px 15px;
}

.loading-circle{
    width:55px;
    height:55px;
}

.loading p{
    font-size:.9rem;
}

}

/* =========================================
   SMALL PHONES
========================================= */

@media (max-width: 420px){

.surah-name{
    font-size:1.92rem !important;
}

.surah-btn{
    height:34px;
}

.basmala{
    font-size:1.2rem;
    margin-top: 20px;
}

.ayahs{
    font-size:1.12rem;
    line-height:2;
}

.surah-title-big{
    font-size:1.6rem;
}

}

/* =========================================
   ULTRA SMALL DEVICES
========================================= */

@media (max-width: 350px){

.surahs-grid{
    gap:8px;
}

.surah-card{
    padding:10px 7px;
}

.surah-name{
    font-size:.8rem !important;
}

.surah-number{
    width:36px;
    height:36px;
}

.surah-icon{
    width:30px;
    height:30px;
}

.ayahs{
    font-size:1rem;
}

}

/* =========================================
   MAIN PAGE BASMALA — MOBILE PREMIUM
========================================= */

@media (max-width:768px){

    .hero{

        padding:18px 12px;

        background:none;

        border:none;

        box-shadow:none;

        backdrop-filter:none;

        margin-bottom:25px;
    }

    .basmala{

        display:block;

        width:100%;

        max-width:360px;

        margin:auto;

        padding:18px 14px;

        border-radius:24px;

        background:
        linear-gradient(
        135deg,
        rgba(212,175,55,.12),
        rgba(255,255,255,.05)
        );

        border:
        1px solid rgba(212,175,55,.22);

        box-shadow:
        0 10px 30px rgba(0,0,0,.22),
        inset 0 0 20px rgba(212,175,55,.08);

        backdrop-filter:blur(14px);

        font-size:1.9rem;

        line-height:2.8rem;

        color:#f6df95;

        text-align:center;

    }

}

/* Small Phones */

@media (max-width:480px){

    .basmala{

        max-width:100%;

        font-size:1.5rem;

        line-height:6.2rem;

        padding:16px 10px;

        border-radius:20px;
    }

}

/* =========================================
   AYAH COUNT FONT STYLE
========================================= */

#ayahCount{

    font-family:'Caveat',cursive !important;

    font-size:1.4rem;

    letter-spacing:1px;

    color:#f6df95;

}

/* =========================================
   AYAH NUMBERS — REAL MUSHAF STYLE
========================================= */

.ayah-number{
    display:inline-flex !important;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    margin:0 6px;
    border-radius:50%;
    background:
    radial-gradient(circle at top,#ffe08a,#c69227);
    color:#2d1808;
    font-family:'Inter',cursive;
    font-size:.6rem;
    font-weight:800;
    vertical-align:middle;
    box-shadow:
    0 3px 10px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

<div class="header-content">

<div class="logo">

<i class="fas fa-book-quran"></i>

القرآن الكريم

</div>

<div class="search-box">

<i class="fas fa-search"></i>

<input style="font-family: Caveat; color: #ccc; font-size: 22px;"
type="text"
placeholder="Search.."
id="searchInput"
/>

</div>

</div>

</header>

<!-- MAIN -->

<main class="main">

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<div class="basmala">
  ﷽
</div>
</div>

</section>

<!-- GRID -->

<div class="surahs-grid" id="surahsGrid"></div>

</main>

<!-- READER -->

<div class="reader-page" id="readerPage">

<button class="close-reader" onclick="closeReader()">

<i class="fas fa-xmark"></i>

</button>

<div class="surah-hero">

<h1 style="font-family: Aref Ruqaa Ink;" class="surah-title-big" id="surahTitle">
سورة الفاتحة
</h1>

<div class="meta">

<div style="font-family: 'Caveat', cursive;" class="meta-box" id="ayahCount">
<span style="font-family: Tajawal,sans-serif;"></span>
</div>

</div>

</div>

<div class="mushaf">

<div
class="basmala-reader"
id="basmalaReader">

بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ

</div>

<div class="ayahs" id="ayahsContainer"></div>

</div>

</div>

<script>

/* =========================================
   SURAHS
========================================= */

const names = [

"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
"هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
"الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
"لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
"فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
"الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
"الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
"نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
"التكوير","الإنفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
"الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
"القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
"المسد","الإخلاص","الفلق","الناس"

];

const surahs = [];

for(let i=1;i<=114;i++){

surahs.push({
number:i,
name:names[i-1]
});

}

/* =========================================
   RENDER
========================================= */

const grid = document.getElementById("surahsGrid");

function renderSurahs(list){

grid.innerHTML = "";

list.forEach(surah=>{

const card = document.createElement("div");

card.className = "surah-card";

card.innerHTML = `

<div class="surah-top">

<div class="surah-number">
${surah.number}
</div>

<div class="surah-icon">
   <i class="fas fa-book-quran"></i>
</div>

</div>

<div class="surah-name">
${surah.name}
</div>


<button class="surah-btn">
    <svg  xmlns="http://www.w3.org/2000/svg" width="36" height="36"  
fill="#874308" viewBox="0 0 24 24" >
<!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
<path d="M18 12c0 1.65-1.35 3-3 3H9v-3l-5 4 5 4v-3h6c2.76 0 5-2.24 5-5V4h-2z"></path>
</svg>
</button>

`;

card.onclick = ()=>openSurah(surah);

grid.appendChild(card);

});

}

renderSurahs(surahs);

/* =========================================
   SEARCH
========================================= */

document.getElementById("searchInput")
.addEventListener("input",function(){

const value = this.value.trim();

const filtered = surahs.filter(s=>
s.name.includes(value)
);

renderSurahs(filtered);

});

/* =========================================
   OPEN SURAH
========================================= */

async function openSurah(surah){

document.getElementById("readerPage").style.display = "block";

document.body.style.overflow = "hidden";

window.scrollTo({
top:0,
behavior:"smooth"
});

document.getElementById("surahTitle").innerHTML =
`سورة ${surah.name}`;

document.getElementById("ayahCount").innerHTML =
`جاري التحميل...`;

document.getElementById("ayahsContainer").innerHTML = `

<div class="loading">

<div class="loading-circle"></div>

<p>
جاري تحميل سورة ${surah.name}
</p>

</div>

`;

if(surah.number == 9){

document.getElementById("basmalaReader").style.display = "none";

}else{

document.getElementById("basmalaReader").style.display = "block";

}

try{

const response = await fetch(
`https://api.alquran.cloud/v1/surah/${surah.number}/quran-uthmani`
);

const result = await response.json();

const ayahs = result.data.ayahs;

document.getElementById("ayahCount").innerHTML =
`${ayahs.length} Ayahs`;

let html = "";

ayahs.forEach((ayah,index)=>{ 
 
html += ` 
 
<span class="ayah"> 
${ayah.text} 
<span class="ayah-number">${index + 1}</span>
</span> 
 
`; 
 
});

document.getElementById("ayahsContainer").innerHTML = html;

}catch(error){

document.getElementById("ayahsContainer").innerHTML = `

<div class="loading">

<p>
فشل تحميل السورة
</p>

</div>

`;

console.log(error);

}

}

/* =========================================
   CLOSE
========================================= */

function closeReader(){

document.getElementById("readerPage").style.display = "none";

document.body.style.overflow = "auto";

}

</script>

</body>

</html>
