<style>

/* ================= RESET ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cairo', sans-serif;
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at 10% 20%, #ffcc80 0%, transparent 40%),
radial-gradient(circle at 80% 10%, #80deea 0%, transparent 45%),
radial-gradient(circle at 30% 80%, #a5d6a7 0%, transparent 50%),
radial-gradient(circle at 90% 70%, #ce93d8 0%, transparent 45%),
linear-gradient(135deg,#fff8e1,#e3f2fd,#f1f8e9);
}

/* ================= PAINT BLOBS ================= */
.blob{
position:absolute;
border-radius:60% 40% 30% 70% / 60% 30% 70% 40%;
filter:blur(45px);
opacity:.75;
animation:float 8s infinite ease-in-out;
z-index:0;
}

.blob1{width:300px;height:300px;background:#ff8a65;top:-90px;left:-120px;}
.blob2{width:340px;height:340px;background:#4fc3f7;bottom:-140px;right:-120px;animation-delay:2s;}
.blob3{width:240px;height:240px;background:#81c784;top:40%;left:60%;animation-delay:4s;}

@keyframes float{
0%,100%{transform:translate(0,0) rotate(0deg);}
50%{transform:translate(30px,-30px) rotate(12deg);}
}

/* ================= BRUSH STROKES ================= */
.stroke{
position:absolute;
width:360px;
height:110px;
background:rgba(255,255,255,0.35);
border-radius:70px;
filter:blur(2px);
z-index:0;
}

.stroke1{top:50px;right:40px;transform:rotate(-12deg);}
.stroke2{bottom:60px;left:40px;transform:rotate(18deg);}

/* ================= DOODLES ================= */
.doodle{
position:absolute;
font-size:55px;
opacity:.25;
animation:wiggle 6s infinite ease-in-out;
z-index:0;
}

@keyframes wiggle{
0%,100%{transform:rotate(0deg);}
50%{transform:rotate(10deg);}
}

/* ================= FLOAT DOTS ================= */
.dot{
position:absolute;
width:10px;
height:10px;
border-radius:50%;
background:white;
opacity:.6;
animation:fall 7s infinite linear;
z-index:0;
}

@keyframes fall{
0%{transform:translateY(-100px);opacity:0;}
50%{opacity:1;}
100%{transform:translateY(100vh);opacity:0;}
}

/* ================= CENTER ================= */
.container{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
position:relative;
z-index:2;
}

/* ================= MAIN CARD ================= */
.card{
width:100%;
max-width:720px;
background:#fffef7;
border-radius:45px;
padding:30px 25px;
text-align:center;
position:relative;
box-shadow:
0 30px 70px rgba(0,0,0,0.18),
inset 0 0 0 6px #ffe0b2,
inset 0 0 0 12px #bbdefb;
overflow:hidden;
}

/* dashed cartoon border */
.card::before{
content:"";
position:absolute;
inset:-6px;
border-radius:50px;
border:4px dashed #ffb74d;
opacity:.6;
}

/* ================= HEADER PAPER ================= */
.top-banner{
margin-bottom:18px;
position:relative;
}

.paper-title{
background:
linear-gradient(135deg,#fff8e1,#ffffff,#e3f2fd);
padding:20px 30px;
border-radius:28px;
border:3px dashed #ffb74d;
box-shadow:
0 12px 25px rgba(0,0,0,0.12),
inset 0 0 15px rgba(0,0,0,0.05);
transform:rotate(-1deg);
position:relative;
}

.paper-title h1{
font-size:34px;
color:#ef6c00;
letter-spacing:2px;
text-shadow:2px 2px 0 #fff3e0;
}

.paper-title p{
font-size:13px;
color:#666;
margin-top:5px;
}

.sticker{
position:absolute;
top:-12px;
right:-12px;
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#fff;
border:2px solid #ffe0b2;
box-shadow:0 6px 15px rgba(0,0,0,0.15);
animation:floatSticker 3s infinite ease-in-out;
}

@keyframes floatSticker{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-6px);}
}

/* ================= QUOTE ================= */
.quote-box{
background:
linear-gradient(135deg,#fff,#fff8e1,#e3f2fd);
border-radius:35px;
padding:35px 25px;
border:3px dotted #ffb74d;
position:relative;
box-shadow:inset 0 0 25px rgba(0,0,0,0.05);
}

.quote-box::before,
.quote-box::after{
content:"";
position:absolute;
width:75px;
height:75px;
border-radius:50%;
filter:blur(14px);
opacity:.35;
}

.quote-box::before{background:#ff7043;top:-25px;right:-25px;}
.quote-box::after{background:#42a5f5;bottom:-25px;left:-25px;}

.quote{
    font-family: Tajawal, sans-serif;
    font-size:30px;
    line-height:2;
    color: #ff8a65;
    font-weight:400;
}

.author{
margin-top:15px;
color:#2e7d32;
font-weight:900;
}

/* ================= BUTTONS ================= */
.buttons{
margin-top:28px;
display:flex;
justify-content:center;
gap:14px;
flex-wrap:wrap;
}

.btn{
display:flex;
align-items:center;
gap:8px;
padding:14px 20px;
border:none;
border-radius:80px;
cursor:pointer;
font-weight:900;
font-size:14px;
color:#fff;

position:relative;
overflow:hidden;

box-shadow:
0 10px 0 rgba(0,0,0,0.18),
0 18px 30px rgba(0,0,0,0.15);

transition:0.25s ease;
}

/* press effect */
.btn:active{
transform:translateY(6px);
box-shadow:0 3px 0 rgba(0,0,0,0.2);
}

/* shine */
.btn::before{
content:"";
position:absolute;
inset:-60%;
background:radial-gradient(circle,rgba(255,255,255,0.45),transparent 60%);
opacity:0;
transition:0.4s;
}

.btn:hover::before{
opacity:1;
}

.icon{
font-size:18px;
}

/* colors */
.btn1{background:linear-gradient(135deg,#ffb74d,#ff7043);}
.btn2{background:linear-gradient(135deg,#64b5f6,#1e88e5);}
.btn3{background:linear-gradient(135deg,#81c784,#2e7d32);}

/* hover */
.btn:hover{
transform:translateY(-5px) rotate(-1deg) scale(1.03);
}

.btn:hover .icon{
animation:bounce 0.5s infinite alternate;
}

@keyframes bounce{
0%{transform:translateY(0);}
100%{transform:translateY(-4px);}
}

@media (max-width: 768px){

/* scale the whole card like a mini version */
.container{
    transform: scale(0.92);
    transform-origin: center;
}

/* reduce spacing so it still fits */
.card{
    padding: 22px 18px;
}

/* slightly smaller text but same design */
.paper-title h1{
    font-size: 42px !important;
}

.quote{
    font-size: 26px !important;
    line-height: 1.9;
}

.author{
    font-size: 14px;
}

/* buttons stay same style but smaller */
.btn{
    padding: 12px 16px;
    font-size: 13px;
}
}

@media (max-width: 480px){

/* stronger scale for small phones */
.container{
    transform: scale(0.82);
    transform-origin: center;
}

/* keep same look but compact */
.card{
    padding: 20px 15px;
}

.paper-title h1{
    font-size: 34px !important;
}

.quote{
    font-size: 22px !important;
}

.buttons{
    gap: 10px;
}
}

@media (max-width: 360px){

.container{
    transform: scale(0.75);
}

.paper-title h1{
    font-size: 28px !important;
}

.quote{
    font-size: 20px !important;
}
}

</style>
</head>

<script>

const quotes = [
    {q:"حاسِبوا أنفسكم قبل أن تُحاسَبوا، وزِنوا أعمالكم قبل أن تُوزَن عليكم", a:"عمر بن الخطاب رضي الله عنه"},
    {q:"إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى", a:"حديث نبوي شريف"},
    {q:"وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا", a:"سورة الطلاق - 2"},
    {q:"لو كان الفقر رجلاً لقتلته", a:"عمر بن الخطاب رضي الله عنه"},
    {q:"الدنيا سجن المؤمن وجنة الكافر", a:"حديث نبوي شريف"},
    {q:"متى استعبدتم الناس وقد ولدتهم أمهاتهم أحراراً؟", a:"عمر بن الخطاب رضي الله عنه"},
    {q:"إذا لم تشغل نفسك بالحق شغلتك بالباطل", a:"الامام الشافعي"},
    {q:"الصبر مفتاح الفرج", a:"الإمام أحمد بن حنبل"},
    {q:"على قدر أهل العزم تأتي العزائم", a:"المتنبي"},
    {q:"من جد وجد ومن زرع حصد", a:"حديث نبوي شريف"},
    {q:"العقل زينة الإنسان", a:"الجاحظ"},
    {q:"الحياة الدنيا ملك لله", a:"الإمام الشافعي"},
    {q:"لا تقهر من استضعفته الأيام، فالدنيا دولة", a:"الإمام علي بن أبي طالب رضي الله عنه"},
    {q:"قيمة كل امرئ ما يحسنه", a:"الامام علي بن أبي طالب رضي الله عنه"},
    {q:"يا ابن آدم، إنما أنت أيام، كلما ذهب يوم ذهب بعضك", a:"الحسن البصري"},
    {q:"لو كانت الدنيا تساوي عند الله جناح بعوضة ما سقي كافرا منها شربة", a:"الإمام علي بن أبي طالب رضي الله عنه"},
    {q:"اعمل لدنياك كأنك تعيش أبدا واعمل لاخرتك كأنك تموت غدا", a:"الإمام علي بن أبي طالب رضي الله عنه"},
    {q:"ما ندمتُ على سكوتي مرة، لكنني ندمتُ على الكلام مرارًا",a:"عمر بن الخطاب"},
    {q:"إذا أردت أن تعرف مقامك عند الله فانظر فيما أقامك",a:"الحسن البصري"},
    {q:"إنما الدنيا حلم، والآخرة يقظة، والموت متوسط، ونحن في أضغاث أحلام",a:"علي بن أبي طالب"},
    {q:"من أصلح سريرته أصلح الله علانيته",a:"ابن القيم الجوزية"},
    {q:"القلب إذا امتلأ من محبة الله لم يكن فيه فراغ لغيره",a:"ابن تيمية"},
    {q:"إن الله إذا أحب عبدًا جعل له نورًا في قلبه",a:"عبد الله بن مسعود"},
    {q:"العلم يهتف بالعمل، فإن أجابه وإلا ارتحل",a:"الإمام الشافعي"},
    {q:"كلما أدّبني الدهر أراني نقص عقلي",a:"الإمام الشافعي"},
    {q:"من عرف الله هانت عليه مصائب الدنيا",a:"الإمام الغزالي"},
    {q:"ليس العيد لمن لبس الجديد، إنما العيد لمن طاعته تزيد",a:"الحسن البصري"},
    {q:"أشدّ الأعمال ثلاثة: ذكر الله على كل حال، والإنصاف من نفسك، ومواساة الأخ في المال",a:"جعفر الصادق"},

    {q:"إذا رأيتَ الله يُعطي العبدَ ما يحبّ وهو مُقيمٌ على معاصيه، فإنما ذلك استدراج",a:"الحسن البصري"},

];

function newQuote(){
let i = Math.floor(Math.random()*quotes.length);
document.getElementById("quote").innerText = quotes[i].q;
document.getElementById("author").innerText = quotes[i].a;
}

function copyQuote(){
navigator.clipboard.writeText(
document.getElementById("quote").innerText +
" - " +
document.getElementById("author").innerText
);
alert("تم النسخ ");
}

function shareQuote(){
let text =
document.getElementById("quote").innerText +
" - " +
document.getElementById("author").innerText;

if(navigator.share){
navigator.share({text});
}else{
navigator.clipboard.writeText(text);
alert("تم النسخ للمشاركة");
}
}

</script>
