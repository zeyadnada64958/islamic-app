    <style>
        :root {
            --primary: #12372A;
            --secondary: #d4af37;
            --bg1: #f8f5ed;
            --bg2: #ece3c9;
            --glass: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tajawal;
            background:
                radial-gradient(circle at top left, rgba(212, 175, 55, 0.08), transparent 30%),
                radial-gradient(circle at bottom right, rgba(18, 55, 42, 0.08), transparent 30%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER */

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 18px 30px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color:darkolivegreen;
            font-family: Caveat,sans-serif;
            font-size: 47px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 300px;
        }

        .logo i {
            color: var(--secondary);
        }

        .menu-btn {
            display: none;
            font-size: 1.6rem;
            color: var(--primary);
            cursor: pointer;
        }

        /* LAYOUT */

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
            padding-top: 85px;
        }

        /* SIDEBAR */

        .sidebar {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(25px);
            border-left: 1px solid rgba(212, 175, 55, 0.25);
            overflow-y: auto;
            padding: 20px;
        }

        .search {
            width: 100%;
            padding: 15px 20px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            font-size: 1.7rem;
            margin-bottom: 20px;
            font-family: Caveat,sans-serif;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .surah {
            padding: 16px 18px;
            margin-bottom: 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: .35s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-weight: 700;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid transparent;
        }
        .surah-number{
            font-family: "Inter", sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(212,175,55,0.15);
            color: #12372A;
            padding: 6px 10px;
            border-radius: 10px;
            min-width: 35px;
            text-align: center;
        }

        .surah:hover {
            transform: translateX(-5px);
            border-color: var(--secondary);
            background: rgba(212, 175, 55, 0.1);
        }

        .surah.active {
            background: linear-gradient(135deg, #d4af37, #f0cf68);
            color: #12372A;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.25);
        }

        /* CONTENT */

        .content {
            padding: 35px;
            overflow-y: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(30px);
            border-radius: 35px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .title {
            text-align: center;
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 30px;
            font-family: Aref Ruqaa Ink,sans-serif;
        }

        .surah-header {
            background: linear-gradient(135deg, #d4af37, #f2d777);
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 35px;
            color: #12372A;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .surah-header i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .ayah-box {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .ayah {
            font-family: 'Amiri';
            font-size: 2.1rem;
            line-height: 2.6;
            text-align: center;
            color: #12372A;
            margin-bottom: 25px;
        }

        .tafsir {
            background: linear-gradient(135deg, #fffdf7, #f8f1dc);
            border-right: 6px solid var(--secondary);
            padding: 25px;
            border-radius: 22px;
            font-family: 'Scheherazade New';
            font-size: 1.55rem;
            line-height: 2.5;
            color: #222;
        }

        .ayah-number {

            margin-bottom: 15px;
            color: var(--primary);
            font-weight: 700;
            font-family: Inter,sans-serif;
            font-size: 1rem;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 100px;
        }

        .loading i {
            font-size: 4rem;
            margin-bottom: 70px;
            color: var(--secondary);
        }

            <div id="list"></div>

        </div>

        <!-- CONTENT -->

        <div  class="content">

            <div style="height: 100%;" class="card">
                <div id="text">

                    <div class="loading">
                        <i class="fas fa-book-quran fa-bounce"></i>
                        <br><br>
                        اضغط على أي سورة لرؤية التفسير الكامل
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

const surahs = [
    "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال",
    "التوبة", "يونس", "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء",
    "الكهف", "مريم", "طه", "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء",
    "النمل", "القصص", "العنكبوت", "الروم", "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر",
    "يس", "الصافات", "ص", "الزمر", "غافر", "فصلت", "الشورى", "الزخرف", "الدخان",
    "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق", "الذاريات", "الطور",
    "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
    "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم",
    "الحاقة", "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان",
    "المرسلات", "النبأ", "النازعات", "عبس", "التكوير", "الانفطار", "المطففين",
    "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد", "الشمس",
    "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة",
    "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون",
    "الكوثر", "الكافرون", "النصر", "المسد", "الإخلاص", "الفلق", "الناس"
];

const list = document.getElementById("list");
const search = document.getElementById("search");
const sidebar = document.getElementById("sidebar");
const menuBtn = document.querySelector(".menu-btn");

/* CREATE SURAHS */

surahs.forEach((surah, index) => {

    const div = document.createElement("div");

    div.className = "surah";

    div.innerHTML = `
        <span class="surah-number">${index + 1}</span>
        <span>${surah}</span>
    `;

    div.onclick = () => loadTafsir(index + 1, surah, div);

    list.appendChild(div);

});

/* ACTIVE SURAH */

function setActive(el) {

    document.querySelectorAll(".surah")
        .forEach(s => s.classList.remove("active"));

    el.classList.add("active");

    if (window.innerWidth <= 768) {
        sidebar.classList.remove("open");
    }
}

/* LOAD REAL IBN KATHEER TAFSEER */

async function loadTafsir(num, name, element) {

    setActive(element);

    const text = document.getElementById("text");

    text.innerHTML = `
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <br><br>
            جاري تحميل التفسير...
        </div>
    `;

    try {

        /* GET QURAN VERSES */

        const quranResponse = await fetch(
            `https://api.alquran.cloud/v1/surah/${num}`
        );

        const quranData = await quranResponse.json();

        const ayahs = quranData.data.ayahs;

        let html = `

            <div class="surah-header">

                <i class="fas fa-book-quran"></i>

                <h2 style="
                    font-family:'Tajawal';
                    font-size:1.5rem;
                    margin-top:10px;
                ">
                    تفسير ابن كثير - سورة ${name}
                </h2>

            </div>

        `;

        /* LOAD TAFSEER */

        const tafsirPromises = ayahs.map(async (ayah) => {

            try {

                const response = await fetch(
                    `https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir/ar-tafsir-ibn-kathir/${num}/${ayah.numberInSurah}.json`
                );

                if (!response.ok) {
                    throw new Error("Failed");
                }

                const data = await response.json();

                return `
                    <div class="ayah-box">

                        <div class="ayah">
                            ${ayah.text}
                        </div>

                        <div class="tafsir">

                            <div class="ayah-number">
                                الآية ${ayah.numberInSurah}
                            </div>

                            ${data.text || data.ayah || "لا يوجد تفسير"}

                        </div>

                    </div>
                `;

            } catch (error) {

                console.log(error);

                return `
                    <div class="ayah-box">

                        <div class="ayah">
                            ${ayah.text}
                        </div>

                        <div class="tafsir">

                            <div class="ayah-number">
                                الآية ${ayah.numberInSurah}
                            </div>

                            تعذر تحميل التفسير

                        </div>

                    </div>
                `;
            }

        });

        const tafsirResults = await Promise.all(tafsirPromises);

        html += tafsirResults.join("");

        text.innerHTML = html;

    } catch (err) {

        console.log(err);

        text.innerHTML = `
            <div class="loading" style="color:#c0392b;">

                <i class="fas fa-triangle-exclamation"></i>

                <br><br>

                حدث خطأ أثناء تحميل التفسير

            </div>
        `;
    }
}

/* SEARCH */

search.addEventListener("input", (e) => {

    const value = e.target.value.toLowerCase();

    Array.from(list.children).forEach(item => {

        item.style.display =
            item.textContent.toLowerCase().includes(value)
                ? "flex"
                : "none";

    });

});

/* MOBILE MENU */

menuBtn.addEventListener("click", () => {

    sidebar.classList.toggle("open");

});

</script>

</body>

</html>
