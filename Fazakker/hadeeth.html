    <style>

        :root {
          --primary-gold: #D4AF37;
          --secondary-gold: #F1C40F;
          --deep-blue: #0F172A;
          --light-blue: #1E3A8A;
          --pearl-white: #F8FAFC;
          --emerald-green: #10B981;
          --rose-gold: #E8B4B8;
          --shadow-soft: rgba(212, 175, 55, 0.1);
          --gradient-primary: linear-gradient(135deg, #0F172A 0%, #1E3A8A 50%, #D4AF37 100%);
          --gradient-hover: linear-gradient(135deg, #D4AF37 0%, #F1C40F 50%, #1E3A8A 100%);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--gradient-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            font-size: 30px;
        }

        /* Floating Particles Background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        

        .particle {
            position: absolute;
            background: var(--secondary-gold);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Header */
        .header {
            position: relative;
            z-index: 10;
            padding: 2rem 0;
            text-align: center;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            background: var(--gradient-hover);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .subtitle {
            color: var(--pearl-white);
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* Search Bar */
        .search-container {
            max-width: 600px;
            margin: 2rem auto;
            position: relative;
            z-index: 10;
        }

        .search-input {
            width: 100%;
            padding: 1.5rem 2rem;
            font-size: 22px;
            border: none;
            border-radius: 50px;
            background: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            outline: none;
            transition: all 0.3s ease;
            color: var(--deep-blue);
            margin-right: 15px;
        }

        .search-input:focus {
            transform: scale(1.02);
            box-shadow: 0 25px 50px rgba(212, 175, 55, 0.3);
        }

        .search-icon {
            width: 30px;
            height: 30px;
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-gold);
            font-size: 1.2rem;
        }

        /* Hadith Cards */
        .hadiths-container {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            z-index: 10;
        }

        .hadith-card {
            background: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.15),
                0 0 0 1px rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .hadith-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-hover);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .hadith-card:hover {
            transform: translateY(-20px) scale(1.02);
            box-shadow: 
                0 40px 80px rgba(212, 175, 55, 0.3),
                0 0 0 1px rgba(212, 175, 55, 0.5);
        }

        .hadith-card:hover::before {
            transform: scaleX(1);
        }

        /* Hadith Number */
        .hadith-number {
            font-family: IBM Plex Sans Arabic,sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            text-align: center;
        }

        /* Hadith Text */
        .hadith-text {
            font-size: 23px;
            line-height: 1.8;
            color: #0F172A;
            margin-bottom: 1.5rem;
            position: relative;
            padding-right: 2rem;
        }

        .hadith-text::before {
            content: 'ﷺ';
            position: absolute;
            right: 0;
            top: 0;
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: var(--primary-gold);
            font-size: 1.5rem;
        }

        /* Source */
        .source {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            color: seagreen;
            font-weight: 600;
        }

        .source i {
            color: var(--emerald-green);
            font-size: 1.2rem;
        }

        /* Lessons Section */
        .lessons {
            font-size: 22px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(212, 175, 55, 0.1));
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            border-left: 5px solid var(--emerald-green);
        }

        .lessons-title {
            color: var(--emerald-green);
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lesson-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.8rem;
            padding: 0.5rem;
            border-radius: 10px;
            transition: background 0.3s ease;
        }

        .lesson-item:hover {
            background: rgba(16, 185, 129, 0.1);
        }

        .lesson-icon {
            color: var(--emerald-green);
            font-size: 1.1rem;
            margin-top: 0.2rem;
        }

        /* Audio Player */
        .audio-player {
            font-size: 20px;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(30, 58, 138, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gradient-hover);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
        }

}

        // Create Particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = (Math.random() * 4 + 2) + 'px';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Render Hadiths
        function renderHadiths(hadithsToShow = hadiths) {
            const container = document.getElementById('hadithsContainer');
            container.innerHTML = '';

            hadithsToShow.forEach(hadith => {
                const card = document.createElement('div');
                card.className = 'hadith-card';
                card.innerHTML = `
                    <div class="hadith-number">${hadith.number}</div>
                    <div class="hadith-text">${hadith.text}</div>
                    <div class="source">
                        <i class="fas fa-book"></i>
                        ${hadith.source}
                    </div>
                    <div class="lessons">
                        <div class="lessons-title">
                            <i class="fas fa-lightbulb"></i>
                            الدروس المستفادة
                        </div>
                        ${hadith.lessons.map(lesson => `
                            <div class="lesson-item">
                                <i class="fas fa-circle-check lesson-icon"></i>
                                <span>${lesson}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="audio-player">
                        <button class="play-btn" onclick="playAudio(this)">
                            <i class="fas fa-play"></i>
                        </button>
                        <span>استمع للحديث</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Search Functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const filtered = hadiths.filter(hadith => 
                hadith.text.toLowerCase().includes(query) ||
                hadith.source.toLowerCase().includes(query)
            );
            renderHadiths(filtered);
        });

        // Audio Player
        function playAudio(button) {
            const icon = button.querySelector('i');
            if (icon.classList.contains('fa-play')) {
                icon.classList.remove('fa-play');
                icon.classList.add('fa-pause');
                // Here you would play the audio
            } else {
                icon.classList.remove('fa-pause');
                icon.classList.add('fa-play');
                // Here you would pause the audio
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            createParticles();
            setTimeout(() => {
                renderHadiths();
            }, 1000);
        });

        // Smooth Scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        
    </script>
